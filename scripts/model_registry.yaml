version: 3
notes: >-
  Model routing for the SUA content conductor.
  GLM via ZAI coding plan (direct), GPT-5.6 Luna xhigh for draft/reviews,
  Gemini 3.6 Flash for SEO review (free key, structured output only).
  Verified live 2026-07-31:
  - glm-5.2 (ZAI direct) retrieved 4/4 real sources, URLs string-matched.
  - gemini-3.6-flash verified working via free Gemini API key for SEO review.
    Previously failed 0/4 on verbatim source retrieval; quarantined to
    structured-checklist stages only (no verbatim reproduction needed).
  GLM policy: always glm-5.2 via ZAI coding plan, not OpenRouter.
  Claude is NOT reachable as a provider here.


providers:
  google:
    api_key_env: GEMINI_API_KEY
    notes: omp reads GEMINI_API_KEY and ignores GOOGLE_API_KEY. Key is in ~/.hermes/.env.
  zai:
    api_key_env: ZAI_API_KEY
    notes: Value comes from GLM_API_KEY in ~/.hermes/.env. Also set in the herdr-server systemd unit.
  openrouter:
    api_key_env: OPENROUTER_API_KEY
    notes: >-
      Pay-per-token fallback with no rolling quota window. Use when a direct provider
      returns 429. Model refs are openrouter/<vendor>/<model>, e.g.
      openrouter/z-ai/glm-5.2. Verified 2026-07-31: glm-5.2, claude-sonnet-5 and
      gpt-5.2 all answer. WATCH THE BALANCE — credits are finite, not a plan.
  openai-codex:
    auth: chatgpt_oauth
    notes: "~/.pi/agent/auth.json. 7-day rolling quota — check `omp usage` before relying on it."

models:
  conductor:
    primary: { provider: zai, model: glm-5.2 }
    fallback: { provider: openrouter, model: z-ai/glm-5.2 }

  research_synthesis:
    primary: { provider: zai, model: glm-5.2 }
    fallback: { provider: openrouter, model: z-ai/glm-5.2 }
    notes: >-
      Parallel retrieval fan-out. Must save verbatim source text to
      .seo-ops/clients/<slug>/sources/ — paraphrase is a failed research stage.

  outline:
    primary: { provider: zai, model: glm-5.2 }
    fallback: { provider: openrouter, model: z-ai/glm-5.2 }

  writer:
    enabled_routes: [primary]
    primary:
      provider: openai-codex
      model: gpt-5.6-luna
      reasoning: xhigh
      purpose: >-
        GPT-5.6 Luna xhigh. Best prose writer. The draft stage receives
        research.md and outline.md via stage chaining, so luna turns structured
        inputs into quality prose. Watch: luna's fast-confidence may work against
        the "cut sections with no facts" discipline — review first draft carefully.
    challenger:
      provider: zai
      model: glm-5.2
      reasoning: high
      purpose: Off by default. Enable for a GLM-vs-GPT bake-off.

  seo_reviewer:
    primary:
      provider: google
      model: gemini-3.6-flash
      notes: >-
        Structured checklist output only (keyword fit, meta quality, internal
        links, FAQ schema). No verbatim source reproduction. Free Gemini API key.

  brand_commercial_reviewer:
    primary: { provider: zai, model: glm-5.2 }
    fallback: { provider: openrouter, model: z-ai/glm-5.2 }

  factual_reviewer:
    primary: { provider: zai, model: glm-5.2, reasoning: high }
    fallback: { provider: openrouter, model: z-ai/glm-5.2 }
    must_use_retrieved_sources: true
    escalation:
      provider: openai-codex
      model: gpt-5.6-sol
      reasoning: xhigh
      purpose: Misattribution is the expensive failure — escalate when codex quota allows.

  image_generation:
    primary: { provider: openai-codex, model: gpt-image-2 }
    notes: Unreviewed. google now offers gemini-3.1-flash-image / gemini-3-pro-image.
